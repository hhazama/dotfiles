---
- name: links | make config home directory
  become_user: "{{ ansible_exec_user }}"
  file:
    state: directory
    mode: "0755"
    path: "{{ xdg_config_home }}"

- name: links | make symlinks
  become_user: "{{ ansible_exec_user }}"
  file:
    state: link
    src: "{{ item }}"
    dest: "{{ xdg_config_home }}{{ item | replace(config_directory_path, '') }}"
    force: yes
  with_lines:
    - "find {{ config_directory_path }} -mindepth 1 -maxdepth 1 -type d"

- name: links | make claude config directories
  become_user: "{{ ansible_exec_user }}"
  file:
    state: directory
    mode: "0755"
    path: "{{ item }}"
  with_items:
    - "{{ xdg_config_home }}/claude"
    - "{{ xdg_config_home }}/claude/skills"

- name: links | create symlink
  become_user: "{{ ansible_exec_user }}"
  file:
    state: link
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    force: "{{ item.force | default('no') }}"
  with_items:
    - src: "{{ xdg_config_home }}/tmux/tmux.conf"
      dest: "{{ ansible_exec_user_home }}/.tmux.conf"
    - src: "{{ xdg_config_home }}/curl/.curlrc"
      dest: "{{ ansible_exec_user_home }}/.curlrc"
    - src: "{{ xdg_config_home }}/claude-settings/CLAUDE.md"
      dest: "{{ xdg_config_home }}/claude/CLAUDE.md"
    - src: "{{ xdg_config_home }}/claude-settings/commands"
      dest: "{{ xdg_config_home }}/claude/commands"
    - src: "{{ xdg_config_home }}/claude-settings/statusline-command.sh"
      dest: "{{ xdg_config_home }}/claude/statusline-command.sh"
    - src: "{{ xdg_config_home }}/claude-settings/RTK.md"
      dest: "{{ xdg_config_home }}/claude/RTK.md"
    - src: "{{ xdg_config_home }}/claude"
      dest: "{{ ansible_exec_user_home }}/.claude"
      force: yes

# settings.json は Claude Code 自身が書き換える(symlink は実ファイルで置換される)ため
# symlink ではなく初回のみ copy。以降の同期は scripts/claude-settings-diff.sh で行う
- name: links | copy claude settings.json (initial only)
  become_user: "{{ ansible_exec_user }}"
  copy:
    src: "{{ config_directory_path }}/claude-settings/settings.json"
    dest: "{{ xdg_config_home }}/claude/settings.json"
    remote_src: yes
    force: no
    mode: "0644"

- name: links | link claude skills
  become_user: "{{ ansible_exec_user }}"
  file:
    state: link
    src: "{{ xdg_config_home }}/claude-settings/skills/{{ item | basename }}"
    dest: "{{ xdg_config_home }}/claude/skills/{{ item | basename }}"
    force: yes
  with_lines:
    - "find {{ config_directory_path }}/claude-settings/skills -mindepth 1 -maxdepth 1 -type d"
