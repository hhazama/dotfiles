---
# brew 本体とパッケージ群のインストール。become_user と PATH(brew)は全タスク共通なので
# block 単位に集約する。パッケージは用途別にタスクを分け、どの群でインストールが落ちたか
# 切り分けやすくする(順次実行のため、ある群で失敗すると後続は止まる)。
- name: homebrew | Install brew and packages
  become_user: "{{ ansible_exec_user }}"
  environment:
    PATH: "/home/linuxbrew/.linuxbrew/bin:{{ ansible_env.PATH }}"
  block:
    - name: homebrew | Install home brew
      shell: '/bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"'
      args:
        creates: /home/linuxbrew/.linuxbrew/bin/brew

    - name: homebrew | Install packages by homebrew
      homebrew:
        state: present
        name:
          - awscli
          - aws-amplify
          - aws-sam-cli
          - bat
          - docker-completion
          - eza
          - fd
          - fzf
          - gh
          - git
          - git-lfs
          - git-delta
          - glab
          - ghq
          - herdr
          - hyperfine
          - jira-cli
          - lazygit
          - lazydocker
          - ripgrep
          - navi
          - neovim
          - tmux
          - uv
          - yq
          - zsh

    - name: homebrew | Install modern CLI tools
      homebrew:
        state: present
        name:
          - zoxide
          - atuin
          - dust
          - duf
          - procs
          - btop
          - difftastic

    - name: homebrew | Install lint and secret-scan tools
      homebrew:
        state: present
        name:
          - shellcheck
          - shfmt
          - gitleaks
          - pre-commit
          - yamllint
          - ansible-lint

    # gh-dash は Homebrew に formula/tap が無いため gh 拡張として導入する
    - name: gh-dash | Install via gh extension
      command: gh extension install dlvhdr/gh-dash
      args:
        creates: "{{ ansible_exec_user_home }}/.local/share/gh/extensions/gh-dash"
