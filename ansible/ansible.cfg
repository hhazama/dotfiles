[defaults]
#stdout_callback = debug
# community.general.yaml callback は削除済み。既定 callback の出力形式で同等の表示にする
result_format = yaml

[ssh_connection]
# "-o ControlMaster=auto -o ControlPersist=60s" is ansible default settings
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
