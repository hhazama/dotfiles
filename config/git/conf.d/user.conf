[user]
	useConfigOnly = true
	name = hazama
	email = 75682336+hhazama@users.noreply.github.com

# 社内 GitLab では forcia のメールを使う。GitHub の noreply だと
# commitSummaryBot がコミッターを someone として集計するため
# remote は ssh:// と scp-like の両形式があるので個別に書く
[includeIf "gitdir:~/ghq/gitlab.fdev/"]
	path = user-forcia.conf
[includeIf "hasconfig:remote.*.url:*://*gitlab.fdev/**"]
	path = user-forcia.conf
[includeIf "hasconfig:remote.*.url:git@gitlab.fdev:*/**"]
	path = user-forcia.conf
