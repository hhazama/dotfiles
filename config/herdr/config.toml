onboarding = false
# herdr 設定。tmux(config/tmux/tmux.conf)の癖に寄せた構成。
# 全キーの一覧: https://herdr.dev/docs/config-reference/
# 反映: herdr server reload-config

[terminal]
# tmux の default-shell /bin/zsh に合わせる
default_shell = "/bin/zsh"

[keys]
# tmux の prefix (C-t) に合わせる。herdr 既定は ctrl+b
prefix = "ctrl+t"

# tmux: bind s split-window -v(上下分割)に合わせる。herdr 既定 prefix+minus から変更
split_horizontal = "prefix+s"
# 既定で settings が prefix+s のため衝突回避で移動(split_vertical=prefix+v は tmux の bind v と一致)
settings = "prefix+shift+s"

# 並列で回すエージェント間を素早く移動する
next_agent = "prefix+a"
previous_agent = "prefix+shift+a"
focus_agent = "prefix+alt+1..9"

# prefix+g は既定で goto に使われているため alt を付ける
[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
width = "90%"
height = "90%"

# タブ行のメモリ表示で気づいたら、その場で食っているコンテナ・プロセスを選んで止める
[[keys.command]]
key = "prefix+m"
type = "popup"
command = "~/.config/herdr/mem-kill.sh"
width = "90%"
height = "80%"

# レビュー待ちの他人の MR を選び、別タブの Claude Code にレビューから approve までさせる
[[keys.command]]
key = "prefix+alt+r"
type = "popup"
command = "~/ghq/gitlab.fdev/hazama/misc/claude/scripts/mr-review/pick.sh"
width = "90%"
height = "80%"

[ui]
show_agent_labels_on_pane_borders = true
# ctrl+t c での new tab 作成時に名前入力ポップアップを出さない(renameは prefix+shift+t)
prompt_new_tab_name = false
# タブ行の右端にメモリ状況を常時出すため、タブが1つでもタブ行を表示する
hide_tab_bar_when_single_tab = false
# 状態変化で並びが動くと目で追えないため、ワークスペース順で固定する
agent_panel_sort = "spaces"
status_indicators = "symbols"
# 並列エージェント・証跡撮影・nvim の同時利用で WSL が OOM しやすいため、使用量と最大プロセスを常に見えるようにする
tab_bar_right = [
  { type = "command", command = "~/.config/herdr/mem-status.sh", interval_seconds = 5, timeout_seconds = 2 },
]

# spaces はあまり使わないので、workspace 行の下にメモリを食っているコンテナ上位10件を出す($c1..$c10 は mem-status.sh が書き込む)
[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace"],
  ["$c1"], ["$c2"], ["$c3"], ["$c4"], ["$c5"],
  ["$c6"], ["$c7"], ["$c8"], ["$c9"], ["$c10"],
]

# Claude Code が端末タイトルに書く作業内容を出し、どのペインが何をしているか分かるようにする
[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", "workspace", "tab"], ["terminal_title_stripped"]]

[ui.toast]
delivery = "herdr"

[ui.sound]
# 裏のワークスペースで許可待ちになったことに気づくため鳴らす
enabled = true

# ダーク系ベースに Monokai Pro を custom で上書き(starship / tig / fzf / lazygit とトーン統一)
[theme]
name = "catppuccin"
auto_switch = false

[theme.custom]
text        = "#fcfcfa"
subtext0    = "#939293"
panel_bg    = "#2d2a2e"
surface_dim = "#221f22"
surface0    = "#403e41"
surface1    = "#5b595c"
overlay0    = "#727072"
overlay1    = "#939293"
accent      = "#78dce8"
blue        = "#78dce8"
teal        = "#78dce8"
green       = "#a9dc76"
yellow      = "#ffd866"
red         = "#ff6188"
mauve       = "#ab9df2"
peach       = "#fc9867"

[experimental]
# server を再起動してもペインの画面履歴を残す
pane_history = true
