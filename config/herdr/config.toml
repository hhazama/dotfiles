onboarding = false
# herdr 設定。tmux(config/tmux/tmux.conf)の癖に寄せた構成。
# 全キーの一覧: https://herdr.dev/docs/config-reference/
# 反映: herdr server reload-config

[terminal]
# tmux の default-shell /bin/zsh に合わせる
default_shell = "/bin/zsh"

[keys]
# tmux の prefix (C-t) に合わせる。herdr 既定は ctrl+b
prefix = "ctrl+t"

# tmux: bind s split-window -v(上下分割)に合わせる。herdr 既定 prefix+minus から変更
split_horizontal = "prefix+s"
# 既定で settings が prefix+s のため衝突回避で移動(split_vertical=prefix+v は tmux の bind v と一致)
settings = "prefix+shift+s"

[ui]
show_agent_labels_on_pane_borders = true
# ctrl+t c での new tab 作成時に名前入力ポップアップを出さない
prompt_new_tab_name = false

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = false

# ダーク系ベースに Monokai Pro を custom で上書き(starship / tig / fzf / lazygit とトーン統一)
[theme]
name = "catppuccin"
auto_switch = false

[theme.custom]
text        = "#fcfcfa"
subtext0    = "#939293"
panel_bg    = "#2d2a2e"
surface_dim = "#221f22"
surface0    = "#403e41"
surface1    = "#5b595c"
overlay0    = "#727072"
overlay1    = "#939293"
accent      = "#78dce8"
blue        = "#78dce8"
teal        = "#78dce8"
green       = "#a9dc76"
yellow      = "#ffd866"
red         = "#ff6188"
mauve       = "#ab9df2"
peach       = "#fc9867"
