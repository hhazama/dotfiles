# prefixキーをC-tに変更する
set -g prefix C-t

# C-bのキーバインドを解除する
unbind C-b
unbind v
unbind s

# キーストロークのディレイを減らす
set -sg escape-time 10

# ウィンドウのインデックスを1から始める
set -g base-index 1

# ペインのインデックスを1から始める
setw -g pane-base-index 1

# ウィンドウを閉じたら番号を詰め直す
set -g renumber-windows on

# prefix(C-t)を2回押すと内側のプログラムに prefix を送る
bind C-t send-prefix

# | でペインを縦に分割する(カレントディレクトリを継承)
bind v split-window -h -c "#{pane_current_path}"

# - でペインを横に分割する(カレントディレクトリを継承)
bind s split-window -v -c "#{pane_current_path}"

# 新規ウィンドウもカレントディレクトリで開く
bind c new-window -c "#{pane_current_path}"

# Vimのキーバインドでペインを移動する
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Vimのキーバインドでペインをリサイズする
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# マウス操作を有効にする
set -g mouse on

#  デフォルトのシェルをZSHにする 
set-option -g default-shell /bin/zsh

# truecolor 端末を使用する(Claude Code TUI / nvim の色再現)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# nvim / claudecode.nvim にフォーカスイベントを転送する
set -g focus-events on

# Claude Code の長い出力を遡れるようにスクロールバックを拡大する
set -g history-limit 50000

# Shift+Enter 等の修飾キーを透過する(Claude Code の改行入力)
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
# ステータスバーの色(monokai-pro トーン: nvim と統一)
set -g status-style fg="#fcfcfa",bg="#221f22"

# ウィンドウリストの色(カレント=シアン、要対応 bell=黄 と役割で色分け)
setw -g window-status-style fg="#939293",bg="default"
setw -g window-status-current-style fg="#2d2a2e",bg="#78dce8",bold

# ペイン境界(アクティブペインを黄でハイライト)
set -g pane-border-style fg="#5b595c"
set -g pane-active-border-style fg="#ffd866"


# ステータスバーを設定する
## 左パネルを設定する
set -g status-left-length 40
set -g status-left "#[fg=#a9dc76,bold] #S #[fg=#939293]#I:#P "
## 右パネルを設定する
set -g status-right "#[fg=#ffd866,bold]#(~/.config/scripts/bin/claude-bell-count)#[default]#[fg=#939293]%Y-%m-%d(%a) #[fg=#fcfcfa,bold]%H:%M "
## リフレッシュの間隔(bell カウントを即応させるため 1秒)
set -g status-interval 1
## ウィンドウリストの位置を中心寄せにする
set -g status-justify centre
## activity 通知は無効(claude の出力で常時チカチカするため。要対応検知は bell(⏳)に一本化)
setw -g monitor-activity off
set -g visual-activity off

## ステータスバーを下部に表示する
set -g status-position bottom

# 同期接続on/off
unbind e
bind e setw synchronize-panes\; display-message "synchronize-panes #{?pane_synchronized,on,off}"

# 設定ファイル再読み込み
bind r source-file ~/.tmux.conf \; display-message "Reload Config!!"

# コピーモードを設定する
## viのキーバインドを使用する
setw -g mode-keys vi

set -g set-clipboard on

# Windows環境でのクリップボード連携 clip.exeはUTF-16LEの入力が必要
#bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip.exe"
#bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "clip.exe"
# Windows環境でのクリップボード連携 win32yank.exeはUTF-8
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "win32yank -i"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "win32yank -i"
# bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"

# Claude Code bell notification
set -g monitor-bell on
set -g bell-action other
setw -g window-status-bell-style "fg=black,bg=yellow,bold"
setw -g window-status-format " #{?window_bell_flag,⏳ ,}#I:#W#{?window_flags,#{window_flags}, } "
setw -g window-status-current-format " #{?window_bell_flag,⏳ ,}#I:#W#{?window_flags,#{window_flags}, } "

# Claude Code チーム起動 (prefix + G)
bind G send-keys 'claude --team' Enter

# Claude セッション一覧ランチャー (prefix + a)
bind a display-popup -w 90% -h 90% -E "claude-sessions"

# カレントディレクトリで claude を新 window 起動 (prefix + C)
bind C new-window -c "#{pane_current_path}" claude

# 要対応(bell)の次セッションへジャンプ (prefix + A)
bind A run-shell '~/.config/scripts/bin/claude-jump-attention'

# エージェント状態サイドバーのトグル (prefix + b, herdr の toggle_sidebar 相当)
bind b run-shell 'claude-sidebar-toggle'

# 新規 window/セッションでサイドバーを自動表示(herdr のデフォルト表示に相当。在れば何もしない)
set-hook -g after-new-window 'run-shell "claude-sidebar-toggle ensure"'
set-hook -g after-new-session 'run-shell "claude-sidebar-toggle ensure"'

