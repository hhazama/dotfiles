# 有効化: make setup-hooks
# コミットをブロックするのは「秘密検知」と「コミットメッセージ形式」の2つのみ。
# shellcheck/shfmt/yamllint/ansible-lint は make lint で手動実行(助言的)。
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
